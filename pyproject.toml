[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "fontmask"
version = "0.1.0"
description = "Patch fonts with Obel Mono-style secret masking rules"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fonttools>=4.68",
  "brotli>=1.2.1",
]

[project.optional-dependencies]
test = ["pytest>=9", "uharfbuzz>=0.57"]

[project.scripts]
fontmask = "fontmask.cli:main"

[tool.ty.environment]
extra-paths = ["typings"]

[tool.uv]
preview-features = ["check-command"]
